<!DOCTYPE html>
<html lang="en">
    <head>
        <title>My Recipe Book | Meals | Chicken Stir Fry</title>
        <link rel="stylesheet" href="styles.css">
        <link rel="stylesheet" href="fontawesome/css/all.css">
    </head>
    <body class="body-recipe">
        <div class="header">
            <a href="meals.html">
                <i class="fas fa-arrow-left"></i>
            </a>
            <img src="images/logo-text.png" alt="Recipe Book Logo">
        </div>
        <main id="recipe">
            <div class="recipe-details">
                <img src="images/chicken stir fry.jpeg" alt="Chicken Stir Fry">
                <h1>Chicken Stir Fry</h1>
                <div class="recipe-details-info">
                    <p><b>Prep time :</b> 30 mins</p>
                    <p style="float: right;"><b>Yield :</b> 4</p>
                    <div class="recipe-details-ingredients">
                        <h2>Ingredients</h2>
                        <input id="stir-01" type="checkbox">
                        <label for="stir-01">500g chicken breast, sliced</label><br />
                        <input id="stir-02" type="checkbox">
                        <label for="stir-02">2 tbsp soy sauce</label><br />
                        <input id="stir-03" type="checkbox">
                        <label for="stir-03">1 tbsp oyster sauce</label><br />
                        <input id="stir-04" type="checkbox">
                        <label for="stir-04">2 cups mixed vegetables</label><br />
                        <input id="stir-05" type="checkbox">
                        <label for="stir-05">2 tbsp vegetable oil</label><br />
                        <input id="stir-06" type="checkbox">
                        <label for="stir-06">1 garlic clove, minced</label>
                    </div>
                    <div class="recipe recipe-details-steps">
                        <h2>Steps</h2>
                        <ol>
                            <li>Heat oil in a large pan or wok.</li>
                            <li>Add garlic and chicken; cook until browned.</li>
                            <li>Add vegetables and stir-fry for 3–5 minutes.</li>
                            <li>Pour in soy and oyster sauces; toss to coat.</li>
                            <li>Serve hot over rice or noodles.</li>
                        </ol>
                    </div>
                </div>
            </div>
        </main>
    </body>
</html>
