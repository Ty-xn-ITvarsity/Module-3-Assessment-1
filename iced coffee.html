<!DOCTYPE html>
<html lang="en">
    <head>
        <title>My Recipe Book | Drinks | Iced Coffee</title>
        <link rel="stylesheet" href="styles.css">
        <link rel="stylesheet" href="fontawesome/css/all.css">
    </head>

    <body class="body-recipe">
        <div class="header">
            <a href="drinks.html">
                <i class="fas fa-arrow-left"></i>
            </a>
            <img src="images/logo-text.png" alt="Recipe Book Logo">
        </div>
        <div id="recipe">
            <div class="recipe-details">
                <img src="images/iced coffee.jpeg" alt="Glass of Iced Coffee">

                <h1>Iced Coffee</h1>

                <div class="recipe-details-info">
                    <p><b>Prep time :</b>10 mins </p>
                    <p style="float: right;"><b>Yield :</b>4</p>

                    <div class="recipe-details-ingredients">
                        <h2>Ingredients</h2>

                        <input id="check-01" type="checkbox">
                        <label for="check-01">2 cups freshly brewed coffee, cooled</label><br />
                        <input id="check-02" type="checkbox">
                        <label for="check-02">1 cup milk (or any milk alternative)</label><br />
                        <input id="check-03" type="checkbox">
                        <label for="check-03">2 tablespoons sugar (optional)</label><br />
                        <input id="check-04" type="checkbox">
                        <label for="check-04">Ice cubes</label><br />
                        <input id="check-05" type="checkbox">
                        <label for="check-05">Whipped cream (optional, for topping)</label>
                    </div>

                    <div class="recipe recipe-details-steps">
                        <h2>Steps</h2>
                        <ol>
                            <li>Brew coffee and let it cool to room temperature.</li>
                            <li>Fill glasses with ice cubes. Pour coffee and milk over ice.</li>
                            <li>Add sugar if desired and stir well.</li>
                            <li>Top with whipped cream if you like. Serve immediately.</li>
                        </ol>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
